####################################
# Tstat Runtime configuration file.
# Use 0/1 to disable/enable features
####################################

# print logs on disk
[log]
rrd_engine = 1                  # logs created by rrd engine
###########
log_tcp_complete = 1            # tcp connections correctly terminated
log_tcp_nocomplete = 1          # tcp connections not properly terminated
log_udp_complete = 1            # udp flows
log_mm_complete = 1             # multimedia (RTP/RTCP)
log_http_complete = 1           # all the HTTP requests/responses
log_dns_complete = 0            # all the DNS queries/answers
log_tcp_periodic = 0            # periodic info on TCP connections
log_udp_periodic = 0            # periodic info on UDP flows

# log options
[options]
tcplog_end_to_end = 1		# Enable the logging of the End_to_End set of measures (RTT, TTL)
tcplog_layer7 = 1		# Enable the logging of the Layer7 set of measures (SSL cert., message counts)
tcplog_options = 1		# Enable the logging of the TCP Options set of measures
tcplog_advanced = 0		# Enable the logging of the Advanced set of measures
				# (not available if Tstat is compiled with PACKET_STATS=0)

httplog_full_url = 2            # Enable the logging of the partial (=1) or full (=2) URLs in log_http_complete

# protocols to dump
[dump]

snap_len = 0        # max num of bytes to dump from ip hdr (included)
                    # 0 == all bytes
slice_win = 0       # dimension (in secs) of the dumping window
                    # used to slice the input traffic in different traces
                    # 0 == no slice

#### UDP traces ####
udp_dns = 0
udp_rtp = 0
udp_rtcp = 0
udp_dtls = 0
udp_quic = 0
udp_mturn = 0
udp_stun = 0        # all the udp traffic that is initiated by STUN
udp_unknown = 0     # all the udp traffic that the DPI doesn't recognize

### Aggregated traces ####
ip_complete = 0     # all the traffic that use ip as level 3 (including tcp, udp, icmp, ...)
###
udp_complete = 0    # only udp traffic
udp_maxpackets = 0
udp_maxbytes = 0
###
tcp_complete = 0    # only tcp traffic
tcp_maxpackets = 0
tcp_maxbytes = 0

###
# This enables the filter based on DNS names requested by clients.
# See the tstat-conf/DNS_config.txt file for more details.
# A filename must be provided with the -F command line option
dns_filter = 0 # enable the dns filtering

###
# This is a bitmask that is used to stop dumping tcp packets of flows we are not interested into
# It is a bitmask based on protocol.h types that the con_type can take.
# Setting this to 0 will keep logging everything
# Setting a bit to 1 will stop logging packets of those protocol as soon as the 
# classifier set those flags
# e.g., setting it to 1025 (1+1024), all http and smtp traffic will be discarded.
# Note that we cannot discard those packets of a flow that we have seen before 
# actually identifying the protocol. For example, three-way-handshake segments will be always there...
# stop_dumping_mask = 0x1BC17 # discard everything we know except UNKNOWN
# stop_dumping_mask = 0x1BC16 # log only UNKNOWN and HTTP
# stop_dumping_mask = 0x19C17 # log only UNKNOWN and SSL/TLS
# stop_dumping_mask = 1       # log everything which is not HTTP
# stop_dumping_mask = 0       # log everything
#
#  1 1011 1100 0001 0111
#  ^ ^ ^^ ^^      ^  ^^^
#  | | || ||      |  |||______ HTTP     (1)
#  | | || ||      |  ||_______ RTSP     (2)
#  | | || ||      |  |________ RTP      (4)
#  | | || ||      |___________ RTCP     (16)
#  | | || ||__________________ SMTP     (1024)
#  | | || |___________________ POP3     (2048)
#  | | ||_____________________ IMAP4    (4096)
#  | | |______________________ SSL/TLS  (8192)
#  | |________________________ SSH      (32768)
#  |__________________________ RTMP     (65536)
#
stop_dumping_mask = 0x1BC16 # log only UNKNOWN and HTTP

